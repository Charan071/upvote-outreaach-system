name: Queue keep-alive

on:
  schedule:
    # Optional backup tick while Railway is always-on (09:00 IST ≈ 03:30 UTC)
    - cron: "30 3 * * 1-5"
    - cron: "*/10 4-18 * * 1-5"
  workflow_dispatch:

jobs:
  tick:
    runs-on: ubuntu-latest
    steps:
      - name: Tick Railway queue
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          curl -fsS -X POST \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            -H "Content-Type: application/json" \
            --max-time 90 \
            https://lunchlist.up.railway.app/api/queue/tick

      # Webhook-independent reconciliation of accepted invites.
      - name: Sync accepted connections
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          curl -fsS -X POST \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            -H "Content-Type: application/json" \
            --max-time 110 \
            "https://lunchlist.up.railway.app/api/relations/sync?pages=3"
