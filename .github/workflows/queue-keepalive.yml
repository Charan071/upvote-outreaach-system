name: Queue keep-alive

on:
  schedule:
    # 03:30 UTC = 09:00 IST — wake Render before local work hours for name lookups
    - cron: "30 3 * * 1-5"
    - cron: "*/10 4-18 * * 1-5"
  workflow_dispatch:

jobs:
  tick:
    runs-on: ubuntu-latest
    steps:
      - name: Wake app and tick queue
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          curl -fsS -X POST \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            -H "Content-Type: application/json" \
            --max-time 90 \
            https://upvote-outreaach-system.onrender.com/api/queue/tick
