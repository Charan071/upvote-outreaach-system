name: Queue keep-alive

on:
  # Disabled 2026-09-05: no longer needed, was pinging the Railway queue
  # endpoint every 10 minutes on weekdays. Trigger manually if ever needed.
  workflow_dispatch:

jobs:
  tick:
    runs-on: ubuntu-latest
    steps:
      - name: Tick Railway queue
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          curl -fsS -X POST \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            -H "Content-Type: application/json" \
            --max-time 90 \
            https://lunchlist.up.railway.app/api/queue/tick
